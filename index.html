<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="no-referrer">
  <title>iOS DevPulse · iOS 开发动态</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07080c;
      --panel: rgba(20,22,30,0.72);
      --hover: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.07);
      --line-2: rgba(255,255,255,0.13);
      --text-1: #eceef3;
      --text-2: #a2a7b4;
      --text-3: #686e7c;
      --accent: #3b8bff;
      --grad: linear-gradient(120deg, #2f80ff 0%, #8b5cf6 60%, #f05138 100%);
      --grid-dot: rgba(255,255,255,0.045);
      --glow-1: rgba(47,128,255,0.16);
      --glow-2: rgba(139,92,246,0.10);
      --new: #ff3b4e;
      --st-beta: #a78bfa;
      --st-rc: #fb923c;
      --st-ga: #34d399;
      --st-review: #60a5fa;
      --st-other: #94a3b8;
      --kbd-bg: rgba(255,255,255,0.06);
    }
    :root[data-theme="light"] {
      --bg: #f7f8fb;
      --panel: rgba(255,255,255,0.88);
      --hover: rgba(10,20,50,0.035);
      --line: rgba(10,20,50,0.08);
      --line-2: rgba(10,20,50,0.15);
      --text-1: #141821;
      --text-2: #545b6b;
      --text-3: #8d93a1;
      --accent: #1f6fe5;
      --grid-dot: rgba(10,20,50,0.06);
      --glow-1: rgba(47,128,255,0.09);
      --glow-2: rgba(139,92,246,0.06);
      --new: #e11d48;
      --st-beta: #7c3aed;
      --st-rc: #ea580c;
      --st-ga: #059669;
      --st-review: #2563eb;
      --st-other: #64748b;
      --kbd-bg: rgba(10,20,50,0.05);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text-1);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(600px 400px at 15% -5%, var(--glow-1), transparent 70%),
        radial-gradient(700px 500px at 95% 0%, var(--glow-2), transparent 70%),
        radial-gradient(circle, var(--grid-dot) 1px, transparent 1px) 0 0 / 22px 22px;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; }

    /* ── Top bar ── */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner { max-width: 1400px; margin: 0 auto; padding: 0 24px; height: 60px; display: flex; align-items: center; gap: 20px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; white-space: nowrap; }
    .logo-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--grad); display: grid; place-items: center; font-size: 15px; box-shadow: 0 0 20px var(--glow-1); }
    .logo small { font-weight: 500; font-size: 12px; color: var(--text-3); letter-spacing: 0; }
    .search {
      flex: 1; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; height: 36px;
      transition: border-color .15s, box-shadow .15s;
    }
    .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow-1); }
    .search svg { color: var(--text-3); flex: none; }
    .search input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: var(--text-1); font: inherit; font-size: 13.5px; }
    .search input::placeholder { color: var(--text-3); }
    kbd { font-family: inherit; font-size: 11px; color: var(--text-3); background: var(--kbd-bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
    .top-right { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .updated { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.2); animation: pulse 2s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } }
    .icon-btn { width: 34px; height: 34px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; display: grid; place-items: center; color: var(--text-2); flex: none; }
    .icon-btn:hover { color: var(--text-1); border-color: var(--line-2); }
    .icon-btn:disabled { cursor: default; opacity: .6; }
    .icon-btn.spin svg { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Layout ── */
    .layout { max-width: 1400px; margin: 0 auto; padding: 24px 24px 64px; display: grid; grid-template-columns: 200px minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
    .side { position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow-y: auto; scrollbar-width: none; }
    .side::-webkit-scrollbar { display: none; }
    .side-title { font-size: 11.5px; color: var(--text-3); padding: 0 10px; margin: 4px 0 8px; letter-spacing: .04em; }
    .side-group + .side-group { margin-top: 22px; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; border: none; background: none; cursor: pointer; text-align: left; color: var(--text-2); font-size: 13.5px; position: relative; }
    .nav-item:hover { background: var(--hover); color: var(--text-1); }
    .nav-item.active { background: var(--panel); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--line); }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--grad); }
    .nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .avatar { width: 20px; height: 20px; border-radius: 6px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 10px; letter-spacing: -0.03em; }
    .avatar.lg { width: 34px; height: 34px; border-radius: 10px; font-size: 13px; }

    /* ── Main header ── */
    .main-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .main-head h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .main-head h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .main-head p { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
    .tabs { display: flex; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .tab { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px; border: none; background: none; cursor: pointer; font-size: 13px; color: var(--text-3); white-space: nowrap; }
    .tab:hover { color: var(--text-1); }
    .tab.active { background: var(--hover); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--line-2); }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .section-title { font-size: 13px; color: var(--text-3); margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
    .section-title:first-child { margin-top: 0; }
    .section-title b { color: var(--text-1); font-size: 14.5px; }

    /* ── Badges ── */
    .badge { display: inline-block; font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
    .new { font-size: 10.5px; line-height: 16px; padding: 0 5px; border-radius: 4px; color: #fff; background: var(--new); font-weight: 700; vertical-align: 1px; }
    .s-beta { color: var(--st-beta); } .s-rc { color: var(--st-rc); } .s-ga { color: var(--st-ga); } .s-other { color: var(--st-other); }
    .s-activeReview { color: var(--st-review); } .s-accepted { color: var(--st-ga); } .s-previewing { color: var(--st-beta); }
    .s-returnedForRevision { color: var(--st-rc); } .s-implemented { color: var(--st-other); } .s-scheduledForReview { color: var(--st-review); }

    /* ── Feed ── */
    /* 紧凑行：来源图标 + 标题 / 一行摘要 + 时间 */
    .list { padding: 4px 6px; }
    .post { display: flex; align-items: flex-start; gap: 12px; padding: 10px 10px; border-radius: 9px; }
    .post + .post { border-top: 1px solid var(--line); border-radius: 0; }
    .post:hover { background: var(--hover); }
    .post .avatar { margin-top: 2px; }
    .post-body { flex: 1; min-width: 0; }
    .post-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .post h3 { font-size: 14px; font-weight: 600; line-height: 1.45; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post:hover h3 { color: var(--accent); }
    .post .summary { font-size: 12.5px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post .summary b { color: var(--text-2); font-weight: 600; }
    .post-time { flex: none; font-size: 11.5px; color: var(--text-3); white-space: nowrap; padding-top: 2px; font-variant-numeric: tabular-nums; }
    .load-more { display: block; margin: 18px auto 0; padding: 9px 22px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); cursor: pointer; color: var(--text-2); }
    .load-more:hover { color: var(--text-1); border-color: var(--accent); }
    .empty { text-align: center; padding: 60px 0; color: var(--text-3); }
    .loading { padding: 80px 0; text-align: center; color: var(--text-3); }

    /* ── Releases ── */
    .ver-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .ver-card { padding: 14px 16px; }
    .ver-card .p { font-size: 12.5px; color: var(--text-3); font-weight: 600; }
    .ver-card .v { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 2px 0 4px; }
    .ver-card:hover { border-color: var(--line-2); }
    .ver-card .pre a:hover { color: var(--accent); }
    .ver-card .d { font-size: 12px; color: var(--text-3); }
    .ver-card .pre { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line-2); font-size: 12.5px; color: var(--text-2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .day { padding: 6px 6px; }
    .day + .day { margin-top: 12px; }
    .day-head { font-size: 12.5px; color: var(--text-3); padding: 8px 12px 4px; font-weight: 600; }
    .rel-row { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 8px; font-size: 13.5px; }
    .rel-row:hover { background: var(--hover); }
    .rel-row .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .rel-row:hover .t { color: var(--accent); }
    .rel-row .plat { width: 74px; flex: none; font-size: 12px; color: var(--text-3); }
    .rel-row .build { font-size: 11.5px; color: var(--text-3); }

    /* ── Libs ── */
    .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .lib { padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
    .lib.fresh { border-color: color-mix(in srgb, var(--new) 55%, transparent); }
    .lib-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .lib-head b { font-size: 15px; }
    .lib:hover { border-color: var(--line-2); }
    .lib-head .repo { margin-left: auto; font-size: 11.5px; color: var(--text-3); }
    .lib-ver { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .lib-ver b { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .lib:hover .lib-ver b { color: var(--accent); }
    .lib-ver span { font-size: 12px; color: var(--text-3); }
    .lib .summary { font-size: 12.5px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .lib .hist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
    .lib .hist a { font-size: 11.5px; color: var(--text-3); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); }
    .lib .hist a:hover { color: var(--text-1); border-color: var(--line-2); }
    .old { color: var(--text-3); font-size: 11.5px; }

    /* ── Evolution ── */
    .evo { padding: 14px 18px; }
    .evo + .evo { margin-top: 10px; }
    .evo-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
    .evo-head .se { font-weight: 700; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .evo h3 { font-size: 14.5px; font-weight: 650; line-height: 1.5; overflow-wrap: anywhere; }
    .evo:hover { border-color: var(--line-2); }
    .evo:hover h3 { color: var(--accent); }
    .evo p { font-size: 12.5px; color: var(--text-2); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

    /* ── Right widgets ── */
    .widget { padding: 14px 16px 12px; }
    .widget + .widget { margin-top: 16px; }
    .widget-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .widget-head b { font-size: 14px; }
    .widget-head small { font-size: 11.5px; color: var(--text-3); }
    .w-row { display: flex; gap: 10px; padding: 6px 0; font-size: 13px; align-items: center; }
    .w-row .k { width: 56px; flex: none; color: var(--text-3); font-size: 12px; }
    .w-row a { flex: 1; min-width: 0; color: var(--text-1); line-height: 1.45; overflow-wrap: anywhere; }
    .w-row a:hover { color: var(--accent); }
    .w-row small { color: var(--text-3); font-size: 11px; white-space: nowrap; }
    .status-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 0; color: var(--text-2); }
    .status-row .t { margin-left: auto; color: var(--text-3); font-size: 11.5px; white-space: nowrap; }
    .section-title .kit-morelink { margin-left: auto; }
    .feed-more { display: flex; justify-content: center; gap: 16px; align-items: center; margin-top: 14px; }
    .feed-more .load-more { margin: 0; }
    .ok { color: #22c55e; } .bad { color: #ef4444; } .warn { color: #f59e0b; }

    /* ── Responsive ── */
    @media (max-width: 1180px) {
      .layout { grid-template-columns: 180px minmax(0, 1fr); }
      /* 右栏挪到正文下面，挂件横排 */
      .right { grid-column: 2; position: static; max-height: none; overflow: visible; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; align-items: start; }
      .right .widget + .widget { margin-top: 0; }
    }
    @media (max-width: 760px) {
      .topbar-inner { padding: 0 14px; gap: 10px; }
      .logo small, .updated span, kbd { display: none; }
      .search { min-width: 0; }
      .layout { grid-template-columns: minmax(0, 1fr); padding: 14px 14px 48px; gap: 14px; }
      .side { position: static; max-height: none; overflow: visible; min-width: 0; }
      .side-group + .side-group { margin-top: 10px; }
      .side-title { display: none; }
      .nav-list { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
      .nav-list::-webkit-scrollbar { display: none; }
      .nav-item { width: auto; flex: none; white-space: nowrap; border: 1px solid var(--line); padding: 5px 10px; }
      .nav-item.active::before { display: none; }
      .nav-item .count { display: none; }
      .tabs { width: 100%; overflow-x: auto; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { padding: 6px 10px; }
      .right { grid-column: auto; grid-template-columns: minmax(0, 1fr); }
      .post { padding: 10px 6px; gap: 10px; }
      .lib-grid { grid-template-columns: minmax(0, 1fr); }
      .ver-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .rel-row .plat { width: 56px; }
    }
    /* ── 详情抽屉 + 列表页（通用组件 kit：电脑右侧滑出，手机底部升起；地址 #/item/类型/id、#/list/key） ── */
    :root { --kit-bg: var(--bg, #0b0a10); --kit-panel: var(--panel, var(--card, rgba(255,255,255,.04))); --kit-line: var(--line, var(--sep, rgba(255,255,255,.08)));
      --kit-line2: var(--line-2, rgba(255,255,255,.14)); --kit-t1: var(--text-1, #f1eff7); --kit-t2: var(--text-2, #a39fb3); --kit-t3: var(--text-3, #6b677a);
      --kit-accent: var(--accent, #a3e635); --kit-hover: var(--hover, rgba(255,255,255,.05)); }
    .kit-mask { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.38); display: none; }
    .kit-mask.open { display: block; }
    .kit-sheet { position: absolute; top: 12px; right: 12px; bottom: 12px; width: clamp(440px, 42vw, 620px); max-width: calc(100vw - 24px);
      display: flex; flex-direction: column; overflow: hidden; color: var(--kit-t1); border-radius: 18px;
      background: linear-gradient(var(--kit-panel), var(--kit-panel)), var(--kit-bg); box-shadow: 0 0 0 1px var(--kit-line2), 0 24px 60px rgba(0,0,0,.45);
      animation: kit-in .24s ease-out; }
    @keyframes kit-in { from { transform: translateX(40px); opacity: 0; } }
    .kit-sheet.kit-small { bottom: auto; }
    .kit-x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
      background: rgba(0,0,0,.5); color: #fff; font-size: 15px; display: grid; place-items: center; }
    .kit-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
    .kit-cover { aspect-ratio: 16/9; background: var(--kit-hover) center / cover no-repeat; position: relative; }
    .kit-cover.tall { aspect-ratio: auto; height: 280px; background-size: contain; background-color: #000; }
    .kit-cover.ph { display: grid; place-items: center; font-size: 56px; aspect-ratio: 16/6; }
    .kit-head { padding: 18px 20px 4px; display: flex; gap: 14px; align-items: flex-start; }
    .kit-head .kit-thumb { flex-shrink: 0; width: 64px; height: 64px; border-radius: 14px; background: var(--kit-hover) center / cover no-repeat;
      display: grid; place-items: center; font-size: 28px; overflow: hidden; }
    .kit-head .kit-t { flex: 1; min-width: 0; padding-right: 30px; }
    .kit-cover + .kit-head .kit-t { padding-right: 0; }
    .kit-head h2 { font-size: 19px; font-weight: 800; line-height: 1.35; letter-spacing: -0.01em; }
    .kit-sub { color: var(--kit-t2); font-size: 13px; margin-top: 4px; }
    .kit-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .kit-tags span { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--kit-hover); color: var(--kit-t2); }
    .kit-big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .kit-big b { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-body { padding: 4px 20px 20px; }
    .kit-sec { padding-top: 16px; }
    .kit-sec + .kit-sec { margin-top: 6px; border-top: 1px solid var(--kit-line); }
    .kit-sec h4 { font-size: 14.5px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .kit-sec h4 small { font-size: 12px; color: var(--kit-t3); font-weight: 500; }
    .kit-kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
    .kit-kv div { background: var(--kit-hover); border-radius: 10px; padding: 8px 11px; min-width: 0; }
    .kit-kv small { display: block; font-size: 11px; color: var(--kit-t3); }
    .kit-kv b { display: block; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
    .kit-p { font-size: 13.5px; line-height: 1.75; color: var(--kit-t2); white-space: pre-line; }
    .kit-rows { display: flex; flex-direction: column; }
    .kit-row { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--kit-line); font-size: 13px; text-decoration: none; color: inherit; }
    .kit-row:first-child { border-top: 0; }
    .kit-row[data-kit-go], a.kit-row { cursor: pointer; }
    .kit-row[data-kit-go]:hover .kit-rt, a.kit-row:hover .kit-rt { color: var(--kit-accent); }
    .kit-row .kit-rt { flex: 1; min-width: 0; line-height: 1.45; }
    .kit-row .kit-rm { color: var(--kit-t3); font-size: 12px; white-space: nowrap; }
    .kit-row img, .kit-row .kit-ri { width: 54px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--kit-hover); }
    .kit-acts { flex-shrink: 0; display: flex; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--kit-line); }
    .kit-acts a, .kit-acts button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 12px; border-radius: 11px;
      font: inherit; font-size: 13.5px; font-weight: 700; text-decoration: none; cursor: pointer; border: 1px solid var(--kit-line2); color: var(--kit-t1); background: transparent; }
    .kit-acts .pri { background: var(--kit-accent); border-color: var(--kit-accent); color: #111; }
    .kit-acts a:hover, .kit-acts button:hover { filter: brightness(1.08); }
    /* 列表页 */
    .kit-lhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .kit-back { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1);
      font-size: 20px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
    .kit-back:hover { background: var(--kit-hover); }
    .kit-lhead h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .kit-lhead small { color: var(--kit-t3); font-size: 12.5px; margin-left: 2px; }
    .kit-lbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .kit-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .kit-chips a, .kit-chips button { padding: 5px 12px; border-radius: 8px; background: var(--kit-hover); color: var(--kit-t2); font: inherit; font-size: 13px;
      font-weight: 600; white-space: nowrap; border: 0; cursor: pointer; text-decoration: none; }
    .kit-chips .on { background: var(--kit-t1); color: var(--kit-bg); }
    .kit-chips small { opacity: .6; margin-left: 4px; font-weight: 500; }
    .kit-sel { padding: 6px 10px; border-radius: 9px; border: 1px solid var(--kit-line2); background: transparent; color: var(--kit-t1); font: inherit; font-size: 12.5px; font-weight: 600; }
    .kit-sel option { background: var(--kit-bg); }
    .kit-more { display: block; margin: 16px auto 0; padding: 9px 22px; border-radius: 10px; border: 1px solid var(--kit-line2); background: transparent;
      color: var(--kit-t1); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .kit-more:hover { background: var(--kit-hover); }
    .kit-morelink { font-size: 13px; font-weight: 600; color: var(--kit-t2); text-decoration: none; white-space: nowrap; cursor: pointer; }
    .kit-morelink:hover { color: var(--kit-t1); }
    [data-kit-item] { cursor: pointer; }
    @media (max-width: 760px) {
      .kit-sheet { top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-width: none; height: 86vh; border-radius: 18px 18px 0 0; animation: kit-up .26s ease-out; }
      @keyframes kit-up { from { transform: translateY(30%); opacity: .5; } }
      .kit-sheet.kit-small { height: auto; }
      .kit-head { padding: 16px 16px 4px; } .kit-body { padding: 4px 16px 18px; } .kit-acts { padding: 10px 16px 16px; }
      .kit-cover.tall { height: 220px; }
      .kit-head .kit-thumb { width: 46px; height: 46px; border-radius: 12px; font-size: 22px; }
      .kit-head h2 { font-size: 17.5px; }
      .kit-big b { font-size: 24px; }
      .kit-lhead h2 { font-size: 19px; }
    }
  </style>
</head>
<body>

<script>
// ── kit：详情抽屉 + 列表页路由（各站通用，内联在页面里）──
// 用法：
//   KIT.item('news', id => ({ title, sub, cover, thumb, tags:[], big, body:'<div class="kit-sec">…</div>', acts:[{text, href, pri}] }))
//   KIT.list('news', (param, query) => { … 把列表页 HTML 写进容器 … })
//   条目元素加 data-kit-item="news/<id>" 即可点击打开详情；「查看更多」写成 <a href="#/list/news">
//   站点首页渲染函数里先调用 KIT.route() —— 返回 true 表示当前是列表页（已渲染），首页不用再渲染
const KIT = (() => {
  const items = {}, lists = {};
  let mask, homeY = 0, fromHome = 0, lastHash = location.hash, onHome = null, listBox = null;
  const kesc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const parse = h => {
    const m = (h === undefined ? location.hash : h).match(/^#\/(item|list)\/([^?]+?)(?:\?(.*))?$/);
    if (!m) return null;
    const [type, ...rest] = m[2].split('/');
    return { kind: m[1], type: decodeURIComponent(type), id: rest.map(decodeURIComponent).join('/'), q: new URLSearchParams(m[3] || '') };
  };
  function ensure() {
    if (mask) return;
    mask = document.createElement('div');
    mask.className = 'kit-mask';
    mask.innerHTML = '<div class="kit-sheet" role="dialog" aria-modal="true"></div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', e => { if (e.target === mask || e.target.closest('[data-kit-close]')) close(); });
  }
  function render(d) {
    ensure();
    const cover = d.cover ? `<div class="kit-cover ${d.coverTall ? 'tall' : ''}" style="background-image:url('${kesc(d.cover).replace(/'/g, '%27')}')"></div>`
      : d.coverIcon ? `<div class="kit-cover ph" style="background:${d.coverBg || 'var(--kit-hover)'}">${d.coverIcon}</div>` : '';
    const thumb = !d.cover && !d.coverIcon && (d.thumb || d.thumbIcon)
      ? `<div class="kit-thumb" style="${d.thumb ? `background-image:url('${kesc(d.thumb).replace(/'/g, '%27')}')` : ''}${d.thumbBg ? `;background-color:${d.thumbBg}` : ''}">${d.thumb ? '' : d.thumbIcon}</div>` : '';
    const acts = (d.acts || []).filter(a => a && (a.href || a.onclick));
    mask.firstElementChild.innerHTML = `<button class="kit-x" data-kit-close aria-label="关闭">✕</button>
      <div class="kit-scroll">${cover}
        <div class="kit-head">${thumb}<div class="kit-t"><h2>${kesc(d.title)}</h2>${d.sub ? `<div class="kit-sub">${d.sub}</div>` : ''}
          ${(d.tags || []).filter(Boolean).length ? `<div class="kit-tags">${d.tags.filter(Boolean).join('')}</div>` : ''}${d.big ? `<div class="kit-big">${d.big}</div>` : ''}</div></div>
        <div class="kit-body">${d.body || ''}</div></div>
      ${acts.length ? `<div class="kit-acts">${acts.map((a, i) => a.href
        ? `<a class="${a.pri || (i === 0 && acts.length < 3) ? 'pri' : ''}" href="${kesc(a.href)}" ${a.self ? '' : 'target="_blank" rel="noopener"'}>${a.text}</a>`
        : `<button class="${a.pri ? 'pri' : ''}" data-kit-act="${i}">${a.text}</button>`).join('')}</div>` : ''}`;
    acts.forEach((a, i) => { if (!a.href) { const b = mask.querySelector(`[data-kit-act="${i}"]`); if (b) b.onclick = a.onclick; } });
    mask.firstElementChild.classList.toggle('kit-small', !!d.small);       // 内容很少的提示：抽屉按内容高度
    mask.querySelector('.kit-scroll').scrollTop = 0;
    mask.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  // 打开详情：写进地址（可分享；浏览器返回 = 关闭）
  function open(key) {
    const target = '#/item/' + key;
    if (location.hash === target) return show(parse(target));
    ensure();
    if (parse()?.kind === 'item') history.replaceState(history.state, '', target);
    else { mask.dataset.base = location.hash; history.pushState({ kit: 1 }, '', target); }
    lastHash = target;
    show(parse(target));
  }
  function show(r) {
    const fn = items[r.type];
    const d = fn && fn(r.id, r.q);
    // 找不到这一条（已下榜 / 过期 / 链接是旧数据里的）：给个提示，而不是什么都不弹
    render(d || { small: true, title: '这条内容已不在当前数据里', sub: '数据每天自动更新，它可能已经下榜、过期或被合并到别的条目', thumbIcon: '🕓',
      body: KIT.p('可以回到首页看最新的内容，或用页面顶部的搜索找一找。'), acts: [{ text: '回到首页', href: '#', self: true, pri: true }] });
    return !!d;
  }
  function close(silent) {
    if (!mask || !mask.classList.contains('open')) return;
    mask.classList.remove('open');
    document.body.style.overflow = '';
    if (!silent && parse()?.kind === 'item') {
      if (history.state && history.state.kit) history.back();          // 从页面里点开的：退回去
      else { history.replaceState(null, '', mask.dataset.base || location.pathname + location.search); lastHash = location.hash; }   // 直接打开的分享链接
    }
  }
  // 当前地址是列表页时渲染列表页并返回 true；首页时返回 false
  function route(box) {
    if (box) listBox = box;
    const r = parse();
    if (r && r.kind === 'list' && lists[r.type]) { lists[r.type](r.id, r.q, listBox); return true; }
    return false;
  }
  // 列表页的公共外壳：返回按钮 + 标题 + 子分类 + 排序
  function shell({ title, note, chips, sort, sortVal, body, more }) {
    return `<div class="kit-lhead"><button class="kit-back" data-kit-back title="返回">‹</button><h2>${kesc(title)}</h2>${note ? `<small>${note}</small>` : ''}</div>
      ${chips || sort ? `<div class="kit-lbar"><div class="kit-chips">${(chips || []).map(c => `<a class="${c.on ? 'on' : ''}" href="${kesc(c.href)}">${kesc(c.text)}${c.count != null ? `<small>${c.count}</small>` : ''}</a>`).join('')}</div>
        ${sort ? `<select class="kit-sel" data-kit-sort>${sort.map(([v, n]) => `<option value="${kesc(v)}" ${v === sortVal ? 'selected' : ''}>${kesc(n)}</option>`).join('')}</select>` : ''}</div>` : ''}
      ${body}${more ? `<button class="kit-more" data-kit-more>${more}</button>` : ''}`;
  }
  function init(home) {
    onHome = home;
    document.addEventListener('click', e => {
      const t = e.target.closest('[data-kit-item],[data-kit-go],[data-kit-back]');
      if (!t) return;
      const inner = e.target.closest('a[href],button,input,select,label,summary');   // 卡片里的其它按钮 / 链接（关注、复制…）优先
      if (inner && inner !== t && t.contains(inner)) return;
      e.preventDefault();
      if (t.dataset.kitBack !== undefined) { fromHome && history.length > fromHome ? history.go(-fromHome) : (location.hash = ''); return; }
      open(t.dataset.kitItem || t.dataset.kitGo);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    window.addEventListener('hashchange', () => {
      const r = parse();
      let was = parse(lastHash), steps = 1;
      if (was && was.kind === 'item') {                                 // 从详情离开
        const base = mask && mask.dataset.base !== undefined ? mask.dataset.base : '';
        if (location.hash === base) { lastHash = location.hash; close(true); return; }   // 只是关掉详情，底下页面不动
        was = parse(base); steps = 2;                                   // 在详情里点了别的列表：按详情底下那页算，返回要退两步
      }
      lastHash = location.hash;
      if (r && r.kind === 'item') { show(r); return; }
      close(true);
      const wasHome = !was;
      if (r && r.kind === 'list') {
        if (wasHome) { homeY = scrollY; fromHome = steps; }
        onHome && onHome();
        if (wasHome || was.type !== r.type) scrollTo(0, 0);
      } else {
        onHome && onHome();
        if (fromHome) { scrollTo(0, homeY); fromHome = 0; }
      }
    });
    // 直接打开带 #/item/ 的链接（比如大屏跳过来）：页面数据读完后由站点调用 KIT.boot()
  }
  function boot() { const r = parse(); if (r && r.kind === 'item') show(r); }
  return { item: (t, fn) => (items[t] = fn), list: (t, fn) => (lists[t] = fn), open, close, route, shell, init, boot, parse, esc: kesc,
    // 小工具：详情里的键值格、段落、关联列表
    kv: rows => { const r = rows.filter(x => x && x[1] != null && x[1] !== ''); return r.length ? `<div class="kit-kv">${r.map(([k, v]) => `<div><small>${kesc(k)}</small><b title="${kesc(v)}">${kesc(v)}</b></div>`).join('')}</div>` : ''; },
    sec: (title, html, note) => html ? `<div class="kit-sec"><h4>${title}${note ? `<small>${note}</small>` : ''}</h4>${html}</div>` : '',
    p: t => t ? `<p class="kit-p">${kesc(t)}</p>` : '',
  };
})();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 反引号包裹的代码片段（Swift 提案标题常见）渲染成 <code>
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem('idp.' + k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem('idp.' + k, JSON.stringify(v)); } catch {} },
};

const PAGE = 40;
const DAY = 86400000;
const NEW_DAYS = 7;
const VIEWS = ['feed', 'releases', 'libs', 'evolution'];
const KINDS = [
  { id: 'all',     name: '全部' },
  { id: 'release', name: '版本发布', source: 'apple-releases' },
  { id: 'news',    name: '开发者新闻', source: 'apple-news' },
  { id: 'blog',    name: 'Swift 博客', source: 'swift-blog' },
  { id: 'lib',     name: '开源库', source: 'libs' },
];
const RANGES = [{ id: 0, name: '不限' }, { id: 7, name: '7 天内' }, { id: 30, name: '30 天内' }, { id: 90, name: '90 天内' }];
const EVO_STATES = [
  ['activeReview', '审核中'], ['scheduledForReview', '待审核'], ['previewing', '预览中'],
  ['accepted', '已接受'], ['returnedForRevision', '退回修改'], ['implemented', '最近实现'],
];
const MAIN_PLATFORMS = ['Xcode', 'iOS', 'iPadOS', 'macOS', 'watchOS', 'tvOS', 'visionOS'];

const state = {
  data: null,
  view: VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get('view', 'feed'),
  kind: 'all',
  range: store.get('range', 0),
  q: '',
  page: 1,
};

// ── 主题 ──
const applyTheme = t => document.documentElement.dataset.theme = t;
applyTheme(store.get('theme', 'dark'));
$('#theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(t); store.set('theme', t);
};

// ── 工具 ──
const srcMap = () => Object.fromEntries(state.data.sources.map(s => [s.id, s]));
const avatar = (s, cls = '') => s ? `<span class="avatar ${cls}" style="background:${s.color}">${esc(s.abbr)}</span>` : '';
const age = iso => iso ? (Date.now() - new Date(iso)) / DAY : Infinity;
const isNew = iso => age(iso) <= NEW_DAYS;
const newTag = iso => isNew(iso) ? ' <span class="new">新</span>' : '';
// 详情 id：动态条目用 url 的哈希（djb2，36 进制），同一条永远一样
const hid = str => { let h = 5381; for (const c of String(str)) h = ((h * 33) ^ c.codePointAt(0)) >>> 0; return h.toString(36); };
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '-') : '';

function timeAgo(iso) {
  if (!iso) return '';
  const d = age(iso);
  if (d < 1 / 24) return `${Math.max(1, Math.round(d * 1440))} 分钟前`;
  if (d < 1) return `${Math.round(d * 24)} 小时前`;
  if (d < 30) return `${Math.round(d)} 天前`;
  if (d < 365) return `${Math.round(d / 30)} 个月前`;
  return `${(d / 365).toFixed(1).replace(/\.0$/, '')} 年前`;
}

function stageClass(stage) {
  if (/beta/i.test(stage)) return 's-beta';
  if (/^RC/i.test(stage)) return 's-rc';
  if (stage === '正式版') return 's-ga';
  return 's-other';
}
const stageBadge = stage => stage ? `<span class="badge ${stageClass(stage)}">${esc(stage)}</span>` : '';

function matchQ(...texts) {
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return texts.some(t => (t || '').toLowerCase().includes(q));
}
const inRange = iso => !state.range || age(iso) <= state.range;
const loadMore = (total, shown) => total > shown ? `<button class="load-more" id="more">加载更多（剩余 ${total - shown} 条）</button>` : '';

// ── 左侧导航 ──
function feedItems(kind = state.kind) {
  return state.data.items.filter(it => (kind === 'all' || it.kind === kind) && inRange(it.date) && matchQ(it.title, it.summary));
}

function renderNav() {
  $('#kinds').innerHTML = KINDS.map(k => `
    <button class="nav-item ${state.view === 'feed' && state.kind === k.id ? 'active' : ''}" data-kind="${k.id}">
      ${k.source ? avatar(srcMap()[k.source]) : '<span class="avatar" style="background:var(--accent)">✦</span>'}${k.name}
      <span class="count">${feedItems(k.id).length}</span>
    </button>`).join('');
  $('#ranges').innerHTML = RANGES.map(r => `
    <button class="nav-item ${state.range === r.id ? 'active' : ''}" data-range="${r.id}">${r.name}</button>`).join('');
}

// ── 视图：动态流 ──
// 一行摘要：版本发布没有正文，用平台 / build 代替；开源库前面带仓库名
function postLine(it, s) {
  if (it.kind === 'release') return [it.platform !== '其他' && it.platform, it.build && `Build ${it.build}`, s && s.name].filter(Boolean).map(esc).join(' · ');
  const text = it.summary && it.summary !== it.title ? it.summary : '';
  return `<b>${esc(it.kind === 'lib' ? it.repo : s ? s.name : it.source)}</b>${text ? ' · ' + esc(text) : ''}`;
}
function feedRows(list) {
  const S = srcMap();
  return list.map(it => {
    const s = S[it.source], id = hid(it.id);
    return `<a class="post" href="#/item/post/${id}" data-kit-item="post/${id}">
      ${avatar(s)}
      <div class="post-body">
        <div class="post-top"><h3>${esc(it.title)}</h3>${it.kind === 'release' && it.platform !== '其他' ? stageBadge(it.stage) : ''}${newTag(it.date)}</div>
        <p class="summary">${postLine(it, s)}</p>
      </div>
      <span class="post-time" title="${esc(fmtDate(it.date))}">${esc(timeAgo(it.date))}</span>
    </a>`;
  }).join('');
}
function renderFeed() {
  const list = feedItems();
  if (!list.length) return '<div class="empty">没有符合条件的动态</div>';
  const shown = list.slice(0, state.page * PAGE);
  return `<div class="card list">${feedRows(shown)}</div>
    <div class="feed-more">${loadMore(list.length, shown.length)}<a class="kit-morelink" href="#/list/feed${state.kind === 'all' ? '' : '?kind=' + state.kind}">列表页查看全部 ${list.length} 条 →</a></div>`;
}

// ── 视图：版本发布 ──
function latestVersions() {
  // 每个平台：最新正式版 + 比它更新的预览版（Beta / RC）
  const rel = state.data.items.filter(it => it.kind === 'release');
  return MAIN_PLATFORMS.map(p => {
    const all = rel.filter(r => r.platform === p).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const ga = all.find(r => r.stage === '正式版');
    const pre = all.find(r => r.stage !== '正式版' && (!ga || r.date > ga.date));
    return { p, ga, pre };
  }).filter(x => x.ga || x.pre);
}

function renderReleases() {
  const cards = latestVersions().map(({ p, ga, pre }) => `
    <div class="card ver-card" data-kit-item="post/${hid((ga || pre).id)}">
      <div class="p">${p}</div>
      ${ga ? `<div class="v">${esc(ga.version)}</div>
              <div class="d">${esc(fmtDate(ga.date))} · ${esc(timeAgo(ga.date))}</div>`
           : '<div class="v" style="color:var(--text-3)">—</div>'}
      ${pre ? `<div class="pre">${stageBadge(pre.stage)}<a href="#/item/post/${hid(pre.id)}" data-kit-item="post/${hid(pre.id)}">${esc(pre.version)}</a><span class="old">${esc(timeAgo(pre.date))}</span></div>` : ''}
    </div>`).join('');

  const rel = releaseItems();
  return `<div class="section-title"><b>当前版本</b>正式版 + 进行中的预览版</div>
    <div class="ver-grid">${cards || '<div class="empty">暂无</div>'}</div>
    <div class="section-title"><b>发布时间线</b>${rel.length} 条${rel.length > HOME_REL ? `<a class="kit-morelink" href="#/list/releases">全部 ${rel.length} 条 →</a>` : ''}</div>
    ${timeline(rel.slice(0, HOME_REL)) || '<div class="empty">没有符合条件的发布</div>'}`;
}
const HOME_REL = 12;      // 首页时间线条数，其余进列表页
const releaseItems = (p = '') => state.data.items.filter(it => it.kind === 'release' && (!p || it.platform === p) && inRange(it.date) && matchQ(it.title, it.platform, it.stage));
// 按天分组的时间线
function timeline(rel) {
  const days = {};
  rel.forEach(r => (days[fmtDate(r.date)] ||= []).push(r));
  return Object.entries(days).map(([d, rows]) => `
    <div class="card day">
      <div class="day-head">${esc(d)}${newTag(rows[0].date)}</div>
      ${rows.map(r => `<a class="rel-row" href="#/item/post/${hid(r.id)}" data-kit-item="post/${hid(r.id)}">
        <span class="plat">${esc(r.platform)}</span>
        <span class="t">${esc(r.title)}</span>
        ${r.platform !== '其他' ? stageBadge(r.stage) : ''}
      </a>`).join('')}
    </div>`).join('');
}

// ── 视图：开源库 ──
function renderLibs() {
  const libs = state.data.libs.filter(l => matchQ(l.name, l.repo, l.version, l.summary));
  if (!libs.length) return '<div class="empty">没有符合条件的库</div>';
  return `<div class="lib-grid">${libs.map(l => {
    const stale = age(l.date) > 730;
    return `<section class="card lib ${isNew(l.date) ? 'fresh' : ''}" data-kit-item="lib/${encodeURIComponent(l.name)}">
      <div class="lib-head"><b>${esc(l.name)}</b>${newTag(l.date)}
        <span class="repo">${esc(l.repo)}</span></div>
      <div class="lib-ver">
        <b>${esc(l.version || '—')}</b>
        <span>${esc(fmtDate(l.date))} · ${esc(timeAgo(l.date))}</span>
        ${stale ? '<span class="old">· 长期未发版</span>' : ''}
        ${l.stale ? '<span class="warn">· 本次抓取失败，显示旧数据</span>' : ''}
      </div>
      ${l.summary ? `<p class="summary">${esc(l.summary)}</p>` : ''}
      <div class="hist">${(l.history || []).slice(1).map(h => `<a ${verLink(h)} title="${esc(fmtDate(h.date))}">${esc(h.version)}</a>`).join('')}</div>
    </section>`;
  }).join('')}</div>`;
}

// 历史版本：动态流里有这条 Release 就站内打开，否则去 GitHub
const verLink = h => byId.has(hid(h.url)) ? `href="#/item/post/${hid(h.url)}" data-kit-item="post/${hid(h.url)}"` : `href="${esc(h.url)}" target="_blank" rel="noopener"`;

// ── 视图：Swift 提案 ──
const HOME_EVO = 5;       // 首页每个状态显示几个
const evoName = st => (EVO_STATES.find(x => x[0] === st) || [, st])[1].replace('最近实现', '已实现');
function evoCard(e) {
  const st = e.state;
  const extra = st === 'activeReview' && e.end ? `审核截止 ${esc(fmtDate(e.end))}` : e.version ? `Swift ${esc(e.version)}` : '';
  return `<article class="card evo" data-kit-item="se/${esc(e.id)}">
    <div class="evo-head"><span class="se">${esc(e.id)}</span><span class="badge s-${esc(st)}">${evoName(st)}</span>${extra ? `<span>${extra}</span>` : ''}</div>
    <h3>${md(e.title)}</h3>
    ${e.summary ? `<p>${md(e.summary)}</p>` : ''}
  </article>`;
}
const evoItems = () => state.data.evolution.filter(e => matchQ(e.id, e.title, e.summary));
function renderEvolution() {
  const evo = evoItems();
  const groups = EVO_STATES.map(([st, name]) => [st, name, evo.filter(e => e.state === st)]).filter(g => g[2].length);
  if (!groups.length) return '<div class="empty">没有符合条件的提案</div>';
  return groups.map(([st, name, rows]) => `
    <div class="section-title"><b>${name}</b>${rows.length} 个${rows.length > HOME_EVO ? `<a class="kit-morelink" href="#/list/evolution?state=${st}">全部 ${rows.length} 个 →</a>` : ''}</div>
    ${rows.slice(0, HOME_EVO).map(evoCard).join('')}`).join('');
}

// ── 右侧挂件 ──
function renderWidgets() {
  const vers = latestVersions().filter(x => ['Xcode', 'iOS', 'macOS', 'watchOS', 'visionOS'].includes(x.p));
  $('#w-versions').innerHTML = vers.map(({ p, ga, pre }) => `
    <div class="w-row"><span class="k">${p}</span>
      ${ga ? `<a href="#/item/post/${hid(ga.id)}" data-kit-item="post/${hid(ga.id)}">${esc(ga.version)}</a>` : '<a>—</a>'}
      ${pre ? `<small>${esc(pre.version)} ${esc(pre.stage)}</small>` : ''}</div>`).join('') || '<div class="w-row"><small>暂无</small></div>';

  const recent = state.data.libs.filter(l => age(l.date) <= 30);
  $('#w-libs').innerHTML = recent.map(l => `
    <div class="w-row"><span class="k">${esc(l.name)}</span>
      <a href="#/item/lib/${encodeURIComponent(l.name)}" data-kit-item="lib/${encodeURIComponent(l.name)}">${esc(l.version)}</a><small>${esc(timeAgo(l.date))}</small></div>`).join('')
    || '<div class="w-row"><small>30 天内没有库发版</small></div>';

  const { sources } = state.data;
  $('#w-ok').textContent = `${sources.filter(s => s.ok).length}/${sources.length} 正常`;
  $('#w-status').innerHTML = sources.map(s => `
    <div class="status-row" title="${esc(s.error)}">${avatar(s)}${esc(s.name)}
      <span class="t">${s.ok ? `<span class="ok">●</span> ${s.count} 条` : `<span class="${s.updated ? 'warn' : 'bad'}">●</span> ${s.updated ? '旧数据' : '失败'}`}</span></div>`).join('');
}

// ── 详情（右侧抽屉）与列表页 ──
let byId = new Map();     // 动态条目：hid(url) → item
const KIND_NAME = { release: '版本发布', news: '开发者新闻', blog: 'Swift 博客', lib: '开源库' };
const LINK_ZH = { 'View release notes': '发布说明', 'View downloads': '下载' };
const fullTime = iso => iso ? new Date(iso).toLocaleString('zh-CN', { hour12: false }).slice(0, -3) : '';
const tag = t => t ? `<span>${t}</span>` : '';
const srcIcon = s => s ? { thumbIcon: `<b style="color:#fff;font-size:18px;letter-spacing:-.03em">${esc(s.abbr)}</b>`, thumbBg: s.color } : { thumbIcon: '📰' };
const goRows = (list, fn) => list.length ? `<div class="kit-rows">${list.map(fn).join('')}</div>` : '';
const postRow = x => `<div class="kit-row" data-kit-go="post/${hid(x.id)}"><span class="kit-rt">${esc(x.title)}</span><span class="kit-rm">${esc(timeAgo(x.date))}</span></div>`;
const outRow = (text, url, note = '↗') => `<a class="kit-row" href="${esc(url)}" target="_blank" rel="noopener"><span class="kit-rt">${esc(text)}</span><span class="kit-rm">${esc(note)}</span></a>`;
const noTick = s => String(s || '').replace(/`/g, '');

function postDetail(it) {
  const S = srcMap(), s = S[it.source];
  const base = { title: it.title, sub: `${esc(s ? s.name : it.source)} · ${esc(fullTime(it.date))} · ${esc(timeAgo(it.date))}`, ...srcIcon(s),
    tags: [tag(KIND_NAME[it.kind]), isNew(it.date) ? tag('7 天内') : ''] };
  const text = it.body || (it.summary !== it.title ? it.summary : '');
  if (it.kind === 'release') {
    const same = state.data.items.filter(x => x.kind === 'release' && x !== it && x.platform === it.platform).slice(0, 8);
    const links = (it.links || []).filter(l => l.url && l.url !== it.url);
    return { ...base, tags: [...base.tags, it.platform !== '其他' ? stageBadge(it.stage) : ''],
      big: it.version ? `<b>${esc(it.platform)} ${esc(it.version)}</b>${it.build ? `<span class="old">Build ${esc(it.build)}</span>` : ''}` : '',
      body: KIT.sec('版本信息', KIT.kv([['平台', it.platform], ['版本号', it.version], ['阶段', it.platform !== '其他' ? it.stage : ''], ['Build', it.build],
          ['发布日期', fmtDate(it.date)], ['本站收录', fmtDate(it.first_seen)]]))
        + KIT.sec('说明', KIT.p(text || 'Apple 版本发布页只给标题和链接，更新内容请看官方发布说明。'))
        + KIT.sec('Apple 官方链接', goRows(links, l => outRow(LINK_ZH[l.text] || l.text, l.url)))
        + KIT.sec(`${esc(it.platform)} 其它版本`, goRows(same, postRow), `<a class="kit-morelink" href="#/list/releases?p=${encodeURIComponent(it.platform)}">全部 →</a>`),
      acts: [{ text: 'Apple 原文 ↗', href: it.url }, ...[links.find(l => /release notes/i.test(l.text)) || links[0]].filter(Boolean).map(l => ({ text: (LINK_ZH[l.text] || l.text) + ' ↗', href: l.url }))] };
  }
  if (it.kind === 'lib') {
    const l = state.data.libs.find(x => x.repo === it.repo);
    const others = state.data.items.filter(x => x.kind === 'lib' && x.repo === it.repo && x !== it);
    return { ...base, sub: `${esc(it.repo)} · ${esc(fullTime(it.date))} · ${esc(timeAgo(it.date))}`,
      big: `<b>${esc(it.version)}</b>${l && l.version === it.version ? '<span class="old">最新版本</span>' : ''}`,
      body: KIT.sec('版本信息', KIT.kv([['库', it.lib], ['仓库', it.repo], ['版本', it.version], ['发布日期', fmtDate(it.date)]]))
        + KIT.sec('Release Notes', KIT.p(text || '这个版本没有填写说明。'))
        + KIT.sec(`${esc(it.lib)} 其它版本`, goRows(others, postRow), l ? `<a class="kit-morelink" href="#/item/lib/${encodeURIComponent(l.name)}" data-kit-go="lib/${encodeURIComponent(l.name)}">库详情 →</a>` : ''),
      acts: [{ text: 'GitHub Release ↗', href: it.url }, { text: '仓库主页 ↗', href: `https://github.com/${it.repo}` }] };
  }
  // 新闻 / 博客
  const same = state.data.items.filter(x => x.source === it.source && x !== it).slice(0, 6);
  return { ...base,
    body: KIT.sec('摘要', KIT.p(text || '这条只有标题，正文请看原文。'))
      + KIT.sec(`${esc(s ? s.name : '')}最近动态`, goRows(same, postRow), `<a class="kit-morelink" href="#/list/feed?kind=${it.kind}">全部 →</a>`),
    acts: [{ text: '阅读原文 ↗', href: it.url }] };
}
KIT.item('post', id => { const it = byId.get(id); return it ? postDetail(it) : null; });
// 平台最新版（大屏用）：#/item/ver/iOS → 该平台最新正式版，没有正式版就取最新预览版
KIT.item('ver', p => { const v = latestVersions().find(x => x.p.toLowerCase() === p.toLowerCase()); return v ? postDetail(v.ga || v.pre) : null; });

KIT.item('lib', name => {
  const l = state.data.libs.find(x => x.name === name); if (!l) return null;
  const S = srcMap();
  const stale = age(l.date) > 730;
  return { title: l.name, sub: `${esc(l.repo)} · 最新 ${esc(l.version || '—')}`, ...srcIcon(S.libs),
    tags: [isNew(l.date) ? tag('7 天内发版') : '', stale ? tag('长期未发版') : '', l.stale ? tag('本次抓取失败，显示旧数据') : ''],
    big: `<b>${esc(l.version || '—')}</b><span class="old">${esc(fmtDate(l.date))} · ${esc(timeAgo(l.date))}</span>`,
    body: KIT.sec('概况', KIT.kv([['仓库', l.repo], ['最新版本', l.version], ['发布日期', fmtDate(l.date)], ['距今', timeAgo(l.date)]]))
      + KIT.sec('最新 Release Notes', KIT.p(l.body || l.summary || '这个版本没有填写说明。'))
      + KIT.sec('历史版本', goRows(l.history || [], h => byId.has(hid(h.url))
          ? `<div class="kit-row" data-kit-go="post/${hid(h.url)}"><span class="kit-rt">${esc(h.version)}</span><span class="kit-rm">${esc(fmtDate(h.date))}</span></div>`
          : outRow(h.version, h.url, fmtDate(h.date) + ' ↗')), `${(l.history || []).length} 个`),
    acts: [{ text: '最新 Release ↗', href: l.url }, { text: '仓库主页 ↗', href: `https://github.com/${l.repo}` }] };
});

KIT.item('se', id => {
  const e = state.data.evolution.find(x => x.id === id); if (!e) return null;
  const same = state.data.evolution.filter(x => x.state === e.state && x !== e).slice(0, 6);
  const review = (e.discussions || []).filter(d => /review/i.test(d.name)).pop();
  return { title: noTick(e.title), sub: `${esc(e.id)} · Swift Evolution`, thumbIcon: '<b style="color:#fff;font-size:17px">SE</b>', thumbBg: '#f05138',
    tags: [`<span class="badge s-${esc(e.state)}">${evoName(e.state)}</span>`, e.version ? tag('Swift ' + esc(e.version)) : ''],
    body: KIT.sec('提案信息', KIT.kv([['编号', e.id], ['状态', evoName(e.state)], ['目标版本', e.version ? 'Swift ' + e.version : ''],
        ['审查开始', fmtDate(e.start)], ['审查截止', fmtDate(e.end)], ['作者', (e.authors || []).join('、')], ['审查经理', (e.review_manager || []).join('、')]]))
      + (e.summary ? KIT.sec('摘要', `<p class="kit-p">${md(e.summary)}</p>`) : '')
      + KIT.sec('论坛讨论', goRows(e.discussions || [], d => outRow(d.name, d.url)))
      + KIT.sec(`同为「${evoName(e.state)}」的提案`, goRows(same, x => `<div class="kit-row" data-kit-go="se/${esc(x.id)}"><span class="kit-rm">${esc(x.id)}</span><span class="kit-rt">${esc(noTick(x.title))}</span></div>`),
          `<a class="kit-morelink" href="#/list/evolution?state=${e.state}">全部 →</a>`),
    acts: [{ text: '提案原文 ↗', href: e.url }, review ? { text: '审查讨论 ↗', href: review.url } : null] };
});

// 列表页：30 条一页，加载更多
const LPAGE = 30;
let listN = LPAGE;
const chip = (text, href, on, count) => ({ text, href, on, count });
KIT.list('feed', (_, q, box) => {
  const kind = q.get('kind') || 'all', all = feedItems(kind);
  box.innerHTML = KIT.shell({ title: '全部动态', note: `${all.length} 条${state.range ? ` · ${state.range} 天内` : ''}`,
    chips: KINDS.map(k => chip(k.name, '#/list/feed' + (k.id === 'all' ? '' : '?kind=' + k.id), k.id === kind, feedItems(k.id).length)),
    body: all.length ? `<div class="card list">${feedRows(all.slice(0, listN))}</div>` : '<div class="empty">没有符合条件的动态</div>',
    more: all.length > listN ? `加载更多（${listN} / ${all.length}）` : '' });
});
KIT.list('releases', (_, q, box) => {
  const p = q.get('p') || '', all = releaseItems(p), plats = [...new Set(releaseItems().map(r => r.platform))];
  box.innerHTML = KIT.shell({ title: '版本发布时间线', note: `${all.length} 条 · Apple 开发者版本发布`,
    chips: [chip('全部', '#/list/releases', !p, releaseItems().length), ...plats.map(x => chip(x, '#/list/releases?p=' + encodeURIComponent(x), x === p, releaseItems(x).length))],
    body: timeline(all.slice(0, listN)) || '<div class="empty">没有符合条件的发布</div>',
    more: all.length > listN ? `加载更多（${listN} / ${all.length}）` : '' });
});
KIT.list('evolution', (_, q, box) => {
  const st = q.get('state') || '', evo = evoItems(), all = evo.filter(e => !st || e.state === st);
  box.innerHTML = KIT.shell({ title: 'Swift 提案', note: `${all.length} 个`,
    chips: [chip('全部', '#/list/evolution', !st, evo.length), ...EVO_STATES.filter(([s]) => evo.some(e => e.state === s))
      .map(([s, n]) => chip(n, '#/list/evolution?state=' + s, s === st, evo.filter(e => e.state === s).length))],
    body: all.length ? all.slice(0, listN).map(evoCard).join('') : '<div class="empty">没有符合条件的提案</div>',
    more: all.length > listN ? `加载更多（${listN} / ${all.length}）` : '' });
});
document.addEventListener('click', e => { if (e.target.closest('[data-kit-more]')) { listN += LPAGE; render(); } });
window.addEventListener('hashchange', () => { if (KIT.parse()?.kind !== 'item') listN = LPAGE; }, true);

// ── 渲染入口 ──
function render() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === state.view));
  renderNav();
  const { items, libs, evolution, updated } = state.data;
  const fresh = items.filter(it => isNew(it.date)).length;
  $('#subtitle').textContent = `${items.length} 条动态 · ${fresh} 条 7 天内新增 · ${libs.length} 个关注的库 · ${evolution.length} 个 Swift 提案`;
  $('#updated').textContent = `更新于 ${new Date(updated).toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}`;
  const isList = KIT.route($('#content'));             // #/list/… 列表页
  $('.main-head').hidden = isList;
  if (isList) return;
  $('#content').innerHTML = { feed: renderFeed, releases: renderReleases, libs: renderLibs, evolution: renderEvolution }[state.view]();
}

async function load(isRefresh) {
  const btn = $('#reload');
  if (btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('spin');
  try {
    const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.data = await res.json();
    byId = new Map(state.data.items.map(it => [hid(it.id), it]));
    renderWidgets();
    render();
    KIT.boot();
    btn.title = '重新加载数据';
  } catch (e) {
    // 刷新失败保留已有内容，只有首次加载失败才替换为报错
    if (!isRefresh || !state.data) {
      $('#content').innerHTML = `<div class="empty">数据加载失败：${esc(e.message)}<br><small>本地预览需通过 HTTP 服务打开（python3 -m http.server）</small></div>`;
    }
    btn.title = '刷新失败，请稍后重试';
  } finally {
    btn.disabled = false;
    btn.classList.remove('spin');
  }
}

// ── 事件绑定 ──
KIT.init(render);
document.addEventListener('click', e => {
  const t = e.target.closest('[data-kind],[data-range],[data-view],#more');
  if (!t || !state.data) return;
  if (t.dataset.kind) { state.kind = t.dataset.kind; state.view = 'feed'; history.replaceState(null, '', '#feed'); }
  else if (t.dataset.range) { state.range = +t.dataset.range; store.set('range', state.range); }
  else if (t.dataset.view) { state.view = t.dataset.view; store.set('view', state.view); history.replaceState(null, '', '#' + state.view); }
  if (t.id === 'more') state.page++; else state.page = 1;
  render();
});

let timer;
$('#q').addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(() => { state.q = e.target.value.trim(); state.page = 1; if (state.data) render(); }, 150);
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && document.activeElement === $('#q')) { $('#q').value = ''; state.q = ''; if (state.data) render(); $('#q').blur(); }
});
if (!/Mac/.test(navigator.platform)) $('#kbd').textContent = 'Ctrl K';
$('#reload').onclick = () => load(true);

load(false);
setInterval(() => load(true), 10 * 60 * 1000);  // 每 10 分钟自动重新读取
</script>
</body>
</html>
